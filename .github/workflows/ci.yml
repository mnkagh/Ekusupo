name: CI

# Every push and every pull request, because the five checks below are
# exactly the ones docs/running-and-testing.md §2 asks a contributor to
# run — CI exists so that asking is not the only thing enforcing them.
on:
  push:
    branches: [main, develop]
  pull_request:

# On a pull request, a new push supersedes the old one: only the newest
# commit's result means anything while a branch is being iterated on.
#
# On a push to main or develop it does NOT cancel, deliberately. Those
# commits are permanent history, and a cancelled run leaves them marked
# "not successful" forever with no way to tell a real failure from a run
# that was simply interrupted by the next push. Several commits here
# ended up in exactly that state — `build-clients` finished in ~35s and
# was recorded, while `verify` took ~3min and was killed mid-run every
# time. Every commit on a permanent branch gets a real answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # `cache: pnpm` needs pnpm to already exist, hence the order.
      # `.nvmrc` keeps the version in one place rather than pinned here
      # and drifting from what contributors actually run.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # Runs against a real embedded Postgres per test (ADR-0024), so
      # this needs no service container — the database is a dependency,
      # not infrastructure.
      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit

  # Separate job: a broken client build must be distinguishable from a
  # broken test at a glance, and these two can run while `verify` does.
  build-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build the web app
        run: pnpm --filter @ekusupo/web build

      # Both extension targets, because Chrome and Firefox need
      # different MV3 manifests and a change can land in one and miss the
      # other (ADR-0031).
      - name: Build the extension for Chrome and Firefox
        run: pnpm --filter @ekusupo/extension build:all

      - name: Upload the built extensions
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            apps/extension/dist
            apps/extension/dist-firefox
          retention-days: 7
