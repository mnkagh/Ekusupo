server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed filenames, so these can be cached indefinitely and a deploy
    # invalidates them by changing the name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deliberately never cached. A stale service worker keeps serving an
    # old app shell after a deploy, and it is the one file that decides
    # when the rest of the cache is replaced — getting it wrong pins
    # users to an old build with no way to recover but clearing site
    # data by hand.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Read by the browser before install; a stale one shows the wrong
    # name or icons on a home screen.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { }
        default_type application/manifest+json;
    }

    # The app is one page (no router), but a PWA launched from a home
    # screen can restore any URL it was last on, and the service worker
    # falls back to the shell for navigations. Serving index.html for
    # anything unmatched keeps both working instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
