packages:
  - "apps/*"
  - "packages/*"
  - "packages/providers/*"
  - "services/*"
  - "tests/*"
allowBuilds:
  esbuild: true
# Transitive dev-dependency CVE fixes — none of these are runtime
# dependencies of anything shipped, but pinning to patched versions
# costs nothing. See `pnpm audit`.
overrides:
  brace-expansion: ">=5.0.9"
  # jsdom pins undici's 7.x line specifically (its own internal API
  # usage breaks on undici 8's changes) — stay patched within 7.x, don't
  # let the range float to 8.
  undici: ">=7.29.0 <8.0.0"
  nanoid: ">=3.3.17"
  postcss: ">=8.5.23"
